groups:
  - name: infrastructure-health-alerts
    rules:
      - alert: HighCPUUsage
        expr: system_cpu_usage_percent > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage has been above 80% for 1 minute."

      - alert: HighMemoryUsage
        expr: system_memory_usage_percent > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage has been above 80% for 1 minute."

      - alert: HighDiskUsage
        expr: system_disk_usage_percent > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage has been above 80% for 1 minute."