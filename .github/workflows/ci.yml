
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install psutil prometheus-client pytest

      - name: Check Python syntax
        run: python -m py_compile health_check.py metrics_exporter.py tests/test_metrics_exporter.py

      - name: Run automated tests
        run: python -m pytest -v
